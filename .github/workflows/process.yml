name: dabir-process
run-name: process ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      id: {required: true}
      rel: {required: true}
      opts: {required: false, default: '{}'}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: jobs, path: data}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/argos-translate
          key: models-v2
      - run: pip install -r requirements.txt
      - name: Speaker deps (optional)
        continue-on-error: true
        run: |
          pip install -r requirements-speakers.txt
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install resemblyzer --no-deps
      - run: python tests/selftest.py
      - run: python process.py
        env:
          JID: ${{ inputs.id }}
          REL: ${{ inputs.rel }}
          OPTS: ${{ inputs.opts }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
      - name: Commit result
        working-directory: data
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A results && git commit -m "result" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs && git push && exit 0; sleep $((RANDOM%10+3)); done
          exit 1
