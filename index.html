async function encodeChunks(pcm,kbps,onp){const enc=new lamejs.Mp3Encoder(1,16000,kbps),out=[],S=1152*40;
for(let i=0;i<pcm.length;i+=S){const b=enc.encodeBuffer(pcm.subarray(i,i+S));if(b.length)out.push(new Uint8Array(b));onp(i/pcm.length);await new Promise(r=>setTimeout(r))}
const e=enc.flush();if(e.length)out.push(new Uint8Array(e));return out}
async function compressAudio(file,kbps,onp){
const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!AC)throw Error(t('cp_nosup'));
await loadLame();onp(0);
const buf=await file.arrayBuffer(),ctx=new AC(1,1,16000);
const ab=await new Promise((ok,no)=>{const p=ctx.decodeAudioData(buf,ok,no);if(p&&p.catch)p.catch(no)});
const ch=ab.numberOfChannels;let m=new Float32Array(ab.length);
for(let c=0;c<ch;c++){const d=ab.getChannelData(c);for(let i=0;i<m.length;i++)m[i]+=d[i]/ch}
if(ab.sampleRate!==16000){const r=ab.sampleRate/16000,o=new Float32Array(Math.floor(m.length/r));for(let i=0;i<o.length;i++){const p=i*r,j=Math.floor(p),q=p-j;o[i]=m[j]*(1-q)+(m[j+1]??m[j])*q}m=o}
let pk=0;for(let i=0;i<m.length;i++){const a=Math.abs(m[i]);if(a>pk)pk=a}
const g=pk>.001?Math.min(4,.95/pk):1,pcm=new Int16Array(m.length);
for(let i=0;i<m.length;i++){const v=Math.max(-1,Math.min(1,m[i]*g));pcm[i]=v<0?v*32768:v*32767}
return new File(await encodeChunks(pcm,kbps,onp),file.name.replace(/\.[^.]+$/,'')+'-dabir.mp3',{type:'audio/mpeg'})}

x.upload.onprogress=e=>onp(e.loaded);x.onload=()=>x.status<300?ok():no(Error('HTTP '+x.status));x.onerror=()=>no(Error('net'));x.send(blob)});

}catch(e){await(e.message.startsWith('HTTP')||e.message=='net'?fail(it,'e_net',e.message):fail(it,e.message))}

// ---- رمزگشایی نتیجه (AES-GCM، کلید فقط نزد کاربر)
const h2b=h=>Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16))),b2b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unseal(env,key){if(!env.ct)return env;const k=await crypto.subtle.importKey('raw',h2b(key),'AES-GCM',false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(env.iv)},k,b2b(env.ct))))}

async function check(it){
try{const r=await api(`/api/jobs/${it.jid}?rel=${it.rel}`,{headers:{'X-Key':it.key}});
if(r.state=='done'){const j=await unseal(r.payload,it.key),fin=j.finished?j.finished*1000:Date.now();if(!j.error)learn(it,j);
return rec(it,j.error?{status:'error',error:j.error,ek:'',expiresAt:fin+KEEP}:{status:'done',result:j,expiresAt:fin+KEEP,stage:''})}
if(r.state=='failed')return fail(it,'e_run');
if(r.state=='finishing'&&(it.miss=(it.miss||0)+1)>8)return fail(it,'e_noresult');
if(['queued','running','finishing'].includes(r.state)){const pg=r.progress||null;if(it.stage!==r.state||JSON.stringify(pg)!==JSON.stringify(it.pg))rec(it,{stage:r.state,pg})}}catch(e){if(e.status==403)fail(it,'e_forbid')}}
